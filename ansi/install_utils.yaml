- name: Install common utility tools
  hosts: nodes
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install tmux, screen, htop, net-tools
      apt:
        name:
          - tmux
          - screen
          - htop
          - net-tools
        state: present

